<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidyalam Laminates | Login</title>
    <meta name="description" content="Vidyalam Laminates sales management portal login" />
    <link rel="icon" type="image/png" href="assets/vidyalam-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <aside class="brand-panel">
        <div class="brand-panel-inner">
          <div class="brand-mark-wrap">
            <img src="assets/vidyalam-logo.png" alt="Vidyalam Laminates logo" class="brand-logo large-logo" />
          </div>
          <div class="brand-text">
            <p class="kicker">VIDYALAM LAMINATES</p>
            <h1>Sales Management Portal</h1>
          </div>
          <div class="brand-lines" aria-hidden="true">
            <span></span>
            <span></span>
          </div>
        </div>
      </aside>

      <main class="login-panel">
        <div class="login-card">
          <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue to your dashboard</p>
          </div>

          <form id="loginForm" class="login-form" novalidate>
            <label class="field-block">
              <span>Email / Employee ID</span>
              <input type="text" id="loginId" placeholder="hr@vidyalam.in or 01 / demo@vidyalam.in" autocomplete="username" />
            </label>

            <label class="field-block">
              <span>Password</span>
              <input type="password" id="password" placeholder="Enter password" />
            </label>

            <div class="form-options">
              <label class="remember">
                <input type="checkbox" checked />
                <span>Remember me</span>
              </label>
              <a href="#">Forgot Password?</a>
            </div>

            <div id="loginError" class="form-message error" aria-live="polite"></div>

            <button type="submit" class="primary-btn full-width">Sign In</button>
          </form>

          <div class="copyright">© 2026 Vidyalam Laminates</div>
        </div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
